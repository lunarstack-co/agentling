name: CI

# Every PR, and pushes to main so merges are checked too.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions in pyproject's classifiers.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests examples

      - name: Format check (ruff)
        run: uv run ruff format --check src tests examples

      - name: Type-check (mypy)
        run: uv run mypy src tests examples

      - name: Test (pytest)
        run: uv run pytest

      - name: Build (verify the package builds)
        run: uv build
